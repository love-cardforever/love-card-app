<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever Love Online - ห้องความทรงจำและระบบคู่รัก</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <!-- html2canvas for card download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        romantic: {
                            50: '#fff1f2', 100: '#ffe4e6', 200: '#fecdd3', 300: '#fda4af',
                            400: '#fb7185', 500: '#f43f5e', 600: '#e11d48', 700: '#be123c',
                        }
                    },
                    fontFamily: { prompt: ['Prompt', 'sans-serif'], cursive: ['Dancing Script', 'cursive'] }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #fce7f3 0%, #ffd1dc 50%, #fbcfe8 100%); min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 20px 40px rgba(225, 29, 72, 0.12); }
        .card-pink { background: linear-gradient(135deg, #fff0f5 0%, #ffe4e6 50%, #fecdd3 100%); border: 2px solid #fda4af; color: #0f172a; }
        .card-yellow { background: linear-gradient(135deg, #fef9c3 0%, #fef08a 100%); border: 2px solid #facc15; color: #713f12; }
        .card-black { background: linear-gradient(135deg, #18181b 0%, #27272a 100%); border: 2px solid #52525b; color: #f8fafc; }
        @keyframes heartGlow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .animate-heart-glow { animation: heartGlow 2s infinite ease-in-out; }
        .scan-laser { position: absolute; width: 100%; height: 4px; background: #f43f5e; box-shadow: 0 0 15px #f43f5e; animation: scanLine 1.5s ease-in-out infinite alternate; }
        @keyframes scanLine { 0% { top: 0%; } 100% { top: 100%; } }
    </style>
</head>
<body class="p-3 md:p-6 text-slate-800 flex flex-col items-center justify-between min-h-screen">

    <!-- HEADER -->
    <header class="w-full max-w-4xl mx-auto mb-6 flex justify-between items-center bg-white/75 backdrop-blur-md p-4 rounded-2xl border border-white/60 shadow-sm">
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchStage('stage-login')">
            <div class="w-10 h-10 rounded-full bg-rose-500 text-white flex items-center justify-center text-xl shadow-md">
                <i class="fa-solid fa-heart"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-slate-800 leading-none">Forever Love Vault</h1>
                <p class="text-xs text-rose-500 font-medium">ระบบบัตรคู่รักออนไลน์</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="switchStage('stage-login')" class="px-3 py-1.5 rounded-xl bg-rose-500 text-white font-medium text-xs">เข้าสู่ระบบ</button>
            <button onclick="switchStage('stage-proposal')" class="px-3 py-1.5 rounded-xl bg-white text-slate-700 font-medium text-xs border">สร้างบัตร</button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="w-full max-w-4xl mx-auto flex-1 flex flex-col justify-center items-center">

        <!-- LOGIN STAGE -->
        <section id="stage-login" class="w-full max-w-md glass-card p-6 md:p-8 rounded-3xl text-center space-y-5">
            <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-800">เข้าสู่ระบบ / ใส่ไอดีบัตร</h2>
            <div class="space-y-3 text-left">
                <input type="text" id="login-id-input" placeholder="กรอกไอดีบัตร หรือ รหัสแอดมิน" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200">
                <input type="password" id="login-pass-input" placeholder="รหัสผ่าน (ถ้ามี)" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200">
                <button onclick="performLogin()" class="w-full py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl shadow-md text-sm">เข้าสู่ระบบ</button>
                <div class="flex justify-between text-xs">
                    <a href="#" onclick="forgotPassword()" class="text-rose-500 hover:underline">ลืมรหัสผ่าน? (ส่งเมลแอดมิน)</a>
                </div>
            </div>
            <div id="login-msg" class="hidden text-xs p-3 rounded-xl"></div>
        </section>

        <!-- PROPOSAL STAGE -->
        <section id="stage-proposal" class="hidden w-full max-w-lg glass-card p-6 md:p-8 rounded-3xl text-center space-y-6">
            <div class="w-20 h-20 rounded-full bg-rose-100 flex items-center justify-center mx-auto text-3xl text-rose-500 animate-heart-glow">
                <i class="fa-solid fa-hand-holding-heart"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">ตกลงเป็นแฟนกันนะ? ❤️</h2>
            <button onclick="acceptProposal()" class="px-8 py-3 bg-rose-500 text-white font-bold rounded-2xl shadow-lg text-sm">เป็นครับ / เป็นค่ะ 💕</button>
        </section>

        <!-- CREATE CARD STAGE -->
        <section id="stage-fingerprint" class="hidden w-full max-w-lg glass-card p-6 md:p-8 rounded-3xl text-center space-y-6">
            <h2 class="text-2xl font-bold text-slate-800">กรอกข้อมูลสร้างบัตรคู่รัก</h2>
            <form id="couple-form" onsubmit="generateCoupleCard(event)" class="space-y-3 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อแฟนคนที่ 1</label>
                    <input type="text" id="partner1" required class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อแฟนคนที่ 2</label>
                    <input type="text" id="partner2" required class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">วันที่เริ่มคบกัน</label>
                    <input type="date" id="startDate" required class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200">
                </div>
                <button type="submit" class="w-full py-3 bg-rose-500 text-white font-bold rounded-xl text-sm mt-2">สร้างบัตรและบันทึกข้อมูล</button>
            </form>
        </section>

        <!-- DASHBOARD STAGE -->
        <section id="stage-dashboard" class="hidden w-full max-w-3xl space-y-6">
            <div class="glass-card p-6 md:p-8 rounded-3xl space-y-6">
                <div class="flex justify-between items-center border-b pb-4">
                    <div>
                        <span class="text-xs font-bold text-rose-600" id="dash-id">ID: ----</span>
                        <h2 class="text-xl font-bold text-slate-900" id="dash-names">-- ❤️ --</h2>
                    </div>
                    <button onclick="logoutVault()" class="px-3 py-1.5 bg-slate-200 rounded-xl text-xs font-semibold">ออกจากระบบ</button>
                </div>

                <!-- CARD DISPLAY -->
                <div id="loveCard" class="w-full rounded-3xl p-6 card-pink shadow-xl relative text-center">
                    <h3 class="font-bold text-lg mb-2">💕 LOVE CARD 💕</h3>
                    <p class="text-xl font-bold" id="card-names-display">--</p>
                    <p class="text-sm mt-2">ระยะเวลาคบกัน: <span id="durationDisplay">กำลังคำนวณ...</span></p>
                    <p class="font-mono text-sm mt-4 font-bold">รหัสไอดีบัตร: <span id="card-id-display">--</span></p>
                </div>

                <div class="flex gap-2">
                    <button onclick="downloadCard()" class="flex-1 py-2.5 bg-rose-500 text-white rounded-xl text-xs font-semibold shadow">📥 บันทึกรูปภาพบัตรลงเครื่อง (บังคับ)</button>
                </div>
            </div>
        </section>

    </main>

    <script>
        function switchStage(stage) {
            document.getElementById('stage-login').classList.add('hidden');
            document.getElementById('stage-proposal').classList.add('hidden');
            document.getElementById('stage-fingerprint').classList.add('hidden');
            document.getElementById('stage-dashboard').classList.add('hidden');
            document.getElementById(stage).classList.remove('hidden');
        }

        function acceptProposal() {
            document.getElementById('stage-proposal').classList.add('hidden');
            document.getElementById('stage-fingerprint').classList.remove('hidden');
        }

        async function performLogin() {
            const username = document.getElementById('login-id-input').value.trim();
            const password = document.getElementById('login-pass-input').value.trim();
            const msg = document.getElementById('login-msg');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                if (data.role === 'admin') {
                    window.location.href = data.redirect; // ไปหน้าแอดมิน
                } else {
                    loadDashboard(data.card);
                }
            } else {
                msg.className = "text-xs p-3 rounded-xl bg-rose-100 text-rose-800 block";
                msg.innerText = data.message || "ไอดีหรือรหัสผ่านไม่ถูกต้อง";
            }
        }

        async function generateCoupleCard(e) {
            e.preventDefault();
            const partner1 = document.getElementById('partner1').value;
            const partner2 = document.getElementById('partner2').value;
            const start_date = document.getElementById('startDate').value;

            const res = await fetch('/api/cards', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ partner1, partner2, start_date })
            });
            const data = await res.json();

            if (data.success) {
                alert(`สร้างบัตรสำเร็จ! ไอดีของคุณคือ: ${data.id}`);
                loadDashboard({ id: data.id, partner1, partner2, start_date, status: 'pink' });
            }
        }

        function loadDashboard(card) {
            switchStage('stage-dashboard');
            document.getElementById('dash-id').innerText = `ID: ${card.id}`;
            document.getElementById('dash-names').innerText = `${card.partner1} ❤️ ${card.partner2}`;
            document.getElementById('card-names-display').innerText = `${card.partner1} ❤️ ${card.partner2}`;
            document.getElementById('card-id-display').innerText = card.id;

            const start = new Date(card.start_date);
            const now = new Date();
            const diffDays = Math.ceil(Math.abs(now - start) / (1000 * 60 * 60 * 24));
            document.getElementById('durationDisplay').innerText = `${diffDays} วัน`;
        }

        async function forgotPassword() {
            const res = await fetch('/api/forgot-password', { method: 'POST' });
            const data = await res.json();
            alert(data.message);
        }

        function downloadCard() {
            html2canvas(document.getElementById('loveCard')).then(canvas => {
                const link = document.createElement('a');
                link.download = 'my-love-card.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function logoutVault() {
            switchStage('stage-login');
        }
    </script>
</body>
</html>
