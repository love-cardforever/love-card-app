<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Love System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { prompt: ['Prompt', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #fce7f3 0%, #ffd1dc 50%, #fbcfe8 100%); min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 20px 40px rgba(225, 29, 72, 0.12); }
    </style>
</head>
<body class="p-3 md:p-6 text-slate-800 flex flex-col items-center justify-between min-h-screen">

    <!-- รหัสซ้ำอีกชั้นตามกำหนด (ซ่อนใน modal ก่อนใช้งานจริง) -->
    <div id="modal-admin-sec" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center space-y-4 shadow-2xl">
            <h3 class="font-bold text-base text-slate-800"><i class="fa-solid fa-shield-halved text-rose-500 mr-1"></i> ยืนยันรหัสความปลอดภัยชั้นที่ 2</h3>
            <input type="text" id="sec-admin-id" placeholder="Admin ID (AdminLove01)" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 outline-none">
            <input type="password" id="sec-admin-pass" placeholder="Password (UnlockAdmin084@#)" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 outline-none">
            <button onclick="verifySecondAdminLayer()" class="w-full py-2.5 bg-rose-500 text-white font-bold rounded-xl text-xs shadow">ปลดล็อคระบบแอดมิน</button>
        </div>
    </div>

    <header class="w-full max-w-6xl mx-auto mb-6 bg-white/80 backdrop-blur-md p-4 rounded-2xl shadow-sm flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center shadow"><i class="fa-solid fa-shield-halved"></i></div>
            <div>
                <h1 class="font-bold text-base text-slate-800">Admin Control Panel</h1>
                <p class="text-[11px] text-rose-500 font-medium">จัดการผู้ใช้และประกาศระบบ (IG: @mumu_apr200x)</p>
            </div>
        </div>
        <button onclick="adminLogout()" class="px-3.5 py-1.5 bg-slate-800 text-white text-xs font-semibold rounded-xl">ออกจากระบบ</button>
    </header>

    <main id="admin-main-content" class="w-full max-w-6xl mx-auto flex-1 space-y-6 hidden">
        <!-- ประกาศข้อความถึงทุกคน -->
        <div class="glass-card p-6 rounded-3xl space-y-4">
            <h3 class="font-bold text-base text-slate-800"><i class="fa-solid fa-bullhorn text-rose-500 mr-2"></i> ประกาศแจ้งเตือนไปยังทุกคน</h3>
            <textarea id="admin-broadcast-text" rows="3" placeholder="พิมพ์ข้อความประกาศ..." class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 outline-none resize-none"></textarea>
            <div class="flex justify-end">
                <button onclick="sendAdminBroadcast()" class="px-5 py-2 bg-rose-500 text-white font-bold rounded-xl text-xs shadow">ส่งประกาศ</button>
            </div>
        </div>

        <!-- รายการคู่รักและผู้ใช้ -->
        <div class="glass-card p-6 rounded-3xl space-y-4">
            <h3 class="font-bold text-base text-slate-800"><i class="fa-solid fa-users text-rose-500 mr-2"></i> ข้อมูลคู่รักและผู้ใช้งานทั้งหมด</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="border-b border-rose-100 text-slate-500 font-semibold">
                            <th class="py-3 px-3">Couple Card ID</th>
                            <th class="py-3 px-3">ชื่อคู่รัก</th>
                            <th class="py-3 px-3">สถานะ</th>
                            <th class="py-3 px-3 text-right">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="admin-couples-table"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const FIREBASE_URL = "https://love-card-app-86e20-default-rtdb.asia-southeast1.firebasedatabase.app";

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('admin_logged') !== 'true') { window.location.href = 'index.html'; return; }
        });

        async function verifySecondAdminLayer() {
            const id = document.getElementById('sec-admin-id').value.trim();
            const pass = document.getElementById('sec-admin-pass').value.trim();
            if (id === 'AdminLove01' && pass === 'UnlockAdmin084@#') {
                document.getElementById('modal-admin-sec').classList.add('hidden');
                document.getElementById('admin-main-content').classList.remove('hidden');
                loadAdminData();
            } else {
                alert('รหัสความปลอดภัยชั้นที่ 2 ไม่ถูกต้อง');
            }
        }

        async function getDB() {
            const res = await fetch(`${FIREBASE_URL}/.json`);
            return await res.json() || { couples: [], users: [], adminRequests: [] };
        }

        async function saveDB(db) {
            await fetch(`${FIREBASE_URL}/.json`, { method: 'PUT', body: JSON.stringify(db), headers: { 'Content-Type': 'application/json' } });
        }

        async function loadAdminData() {
            const db = await getDB();
            const table = document.getElementById('admin-couples-table');
            table.innerHTML = '';
            (db.couples || []).forEach(c => {
                table.innerHTML += `
                    <tr class="border-b border-rose-50">
                        <td class="py-3 px-3 font-mono text-rose-600 font-bold">${c.id}</td>
                        <td class="py-3 px-3">${c.user1Name} & ${c.user2Name}</td>
                        <td class="py-3 px-3">${c.status}</td>
                        <td class="py-3 px-3 text-right">
                            <button onclick="addQuotaAdmin('${c.id}')" class="px-2 py-1 bg-amber-500 text-white rounded text-xs">เพิ่มโควต้า</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function addQuotaAdmin(coupleId) {
            const db = await getDB();
            const c = db.couples.find(x => x.id === coupleId);
            if (c) { c.reconcileQuota = (c.reconcileQuota || 3) + 1; await saveDB(db); loadAdminData(); alert('เพิ่มโควต้าเรียบร้อย'); }
        }

        async function sendAdminBroadcast() {
            const text = document.getElementById('admin-broadcast-text').value.trim();
            if (!text) return;
            const db = await getDB();
            db.users.forEach(u => {
                if (!u.notifications) u.notifications = [];
                u.notifications.push({ id: Date.now(), type: 'ADMIN_BROADCAST', message: `📢 ประกาศแอดมิน: ${text}`, time: new Date().toLocaleString() });
            });
            await saveDB(db);
            document.getElementById('admin-broadcast-text').value = '';
            alert('ส่งประกาศสำเร็จ');
        }

        function adminLogout() { localStorage.removeItem('admin_logged'); window.location.href = 'index.html'; }
    </script>
</body>
</html>
